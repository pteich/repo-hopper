name: Go

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        # GitHub provides free native runners for all three OS for public repos
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go-version: [ '1.27.x' ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod tidy

      - name: Build desktop app
        run: go build -o repo-hopper${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/desktop/

      - name: Build CLI
        run: go build -o repo-hopper-cli${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/cli/

      - name: Test
        run: go test -v ./...
